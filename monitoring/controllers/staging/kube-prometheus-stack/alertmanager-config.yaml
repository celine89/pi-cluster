apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: staging-email-alerts
  namespace: monitoring
spec:
  route:
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    receiver: 'gmail-staging'
  receivers:
  - name: 'gmail-staging'
    emailConfigs:
    - to: 'selin.petrosian89@gmail.com'
      smarthost: 'smtp.gmail.com:587'
      authUsername: 'selin.petrosian89@gmail.com'
      # Can reference a Secret key containing your Gmail App Password
      authPassword:
        name: gmail-smtp-secret
        key: password
      sendResolved: true
